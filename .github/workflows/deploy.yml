# ─────────────────────────────────────────────────────────────────────────────
#  Snappy Matrix · CI/CD pipeline
#  Triggers on every push to main, plus manual dispatch from the Actions tab.
#  Workflow:
#    1. Bump the patch version (vX.Y.Z) in index.html
#    2. Inject a fresh cache-bust timestamp into every ?v=… asset query string
#    3. Commit the version bump back to main with [skip ci] so we don't loop
#    4. Publish the static site to the gh-pages branch (GitHub Pages deploy)
#  Manual rollback instructions live in README.md → "Manual rollbacks".
# ─────────────────────────────────────────────────────────────────────────────
name: Deploy Snappy Matrix

on:
  push:
    branches: [main]
    # Skip the workflow when the bump commit itself lands so we don't recurse
    paths-ignore:
      - '.github/workflows/**'
  # Allow re-running deploys manually from the Actions tab (handy for rollbacks)
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag or commit SHA to deploy (leave blank for HEAD of main)'
        required: false
        default: ''

# Only one deploy job at a time — newer pushes cancel in-progress runs
concurrency:
  group: deploy-snappy-matrix
  cancel-in-progress: true

permissions:
  contents: write   # needed to push the version bump commit + tag back to main
  pages: write      # needed to publish to GitHub Pages
  id-token: write   # required by the official Pages deploy action

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # ──────────────────────────────────────────────────────────────────────
      # 1. Check out the repo. fetch-depth: 0 lets us read existing tags so we
      #    can compute the next version number without a separate API call.
      # ──────────────────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.ref || github.ref }}
          # Use a token so subsequent `git push` from this job can write back
          token: ${{ secrets.GITHUB_TOKEN }}

      # ──────────────────────────────────────────────────────────────────────
      # 2. Skip the bump+commit when the trigger is workflow_dispatch with a
      #    pinned ref — rollbacks should re-deploy the same code, not rev it.
      # ──────────────────────────────────────────────────────────────────────
      - name: Decide whether to bump
        id: mode
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ github.event.inputs.ref }}" ]]; then
            echo "bump=false" >> "$GITHUB_OUTPUT"
            echo "📌 Manual deploy of pinned ref — skipping version bump."
          else
            echo "bump=true"  >> "$GITHUB_OUTPUT"
          fi

      # ──────────────────────────────────────────────────────────────────────
      # 3. Read the current version from index.html, bump the patch number
      #    (v218.5 → v218.6), and inject a fresh build timestamp used as the
      #    asset cache-bust query string.
      # ──────────────────────────────────────────────────────────────────────
      - name: Bump version + inject cache-bust
        if: steps.mode.outputs.bump == 'true'
        id: bump
        run: |
          # Pull the current version (e.g. v218.5) from the version badge
          CURRENT=$(grep -oE 'appVersionBadge[^>]*>v[0-9]+\.[0-9]+(\.[0-9]+)?' index.html | grep -oE 'v[0-9]+\.[0-9]+(\.[0-9]+)?' | head -1)
          if [ -z "$CURRENT" ]; then
            echo "❌ Could not find current version in index.html"
            exit 1
          fi
          echo "Current version: $CURRENT"

          # Strip the leading "v" then bump the last number (patch)
          NUM=${CURRENT#v}
          MAJOR=$(echo "$NUM" | cut -d. -f1)
          MINOR=$(echo "$NUM" | cut -d. -f2)
          PATCH=$(echo "$NUM" | cut -d. -f3)
          if [ -z "$PATCH" ]; then
            # No patch component (e.g. v218 → v218.1)
            NEXT="v${MAJOR}.$((MINOR + 1))"
          else
            NEXT="v${MAJOR}.${MINOR}.$((PATCH + 1))"
          fi
          echo "Next version:    $NEXT"

          # UTC build timestamp — drives the ?v=… cache-bust string on every asset
          STAMP=$(date -u +'%Y%m%d%H%M%S')
          BUST="${STAMP}${NEXT}"
          echo "Cache-bust:      $BUST"

          # Replace every ?v=…<oldversion> occurrence with the new build stamp
          # Matches strings like "?v=20260505v218.5" → "?v=20260507093012v218.6"
          sed -i -E "s|\\?v=[0-9]+v[0-9]+(\\.[0-9]+)?|?v=${BUST}|g" index.html

          # Bump the human-visible version badge + the inline APP_VERSION constant
          # used by the auto cache-buster script
          sed -i -E "s|appVersionBadge[^>]*>${CURRENT}|&__TMP__|" index.html
          sed -i -E "s|${CURRENT}__TMP__|${NEXT}|" index.html
          sed -i -E "s|(badge-date[^>]*>Updated )[0-9]+/[0-9]+/[0-9]+( \&middot; )${CURRENT}|\\1$(date -u +'%-m/%-d/%Y')\\2${NEXT}|" index.html
          sed -i -E "s|(var APP_VERSION = ')${CURRENT}(';)|\\1${NEXT}\\2|" index.html

          # Expose for later steps
          echo "version=${NEXT}"  >> "$GITHUB_OUTPUT"
          echo "previous=${CURRENT}" >> "$GITHUB_OUTPUT"
          echo "bust=${BUST}"      >> "$GITHUB_OUTPUT"

      # ──────────────────────────────────────────────────────────────────────
      # 4. Commit the bump back to main and tag the release. The "[skip ci]"
      #    marker prevents the push from re-triggering this workflow.
      # ──────────────────────────────────────────────────────────────────────
      - name: Commit + tag version bump
        if: steps.mode.outputs.bump == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Nothing changed — skipping commit."
          else
            git commit -m "ci: bump ${{ steps.bump.outputs.previous }} → ${{ steps.bump.outputs.version }} [skip ci]"
            git tag "${{ steps.bump.outputs.version }}"
            git push origin HEAD:main --tags
          fi

      # ──────────────────────────────────────────────────────────────────────
      # 5. Stage the static site for GitHub Pages. Snappy Matrix is a flat
      #    static site, so the repo root IS the build output.
      # ──────────────────────────────────────────────────────────────────────
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .   # repo root → all html/js/css/asset files

      # ──────────────────────────────────────────────────────────────────────
      # 6. Publish. Live URL is shown in the action summary once this finishes.
      # ──────────────────────────────────────────────────────────────────────
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

      - name: Summary
        run: |
          echo "### ✅ Snappy Matrix deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.mode.outputs.bump }}" = "true" ]; then
            echo "- **Version:** ${{ steps.bump.outputs.previous }} → **${{ steps.bump.outputs.version }}**" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Cache-bust stamp:** \`${{ steps.bump.outputs.bust }}\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Tag:** \`${{ steps.bump.outputs.version }}\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- **Mode:** Manual redeploy of \`${{ github.event.inputs.ref }}\` (no bump)" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "- **Live URL:** ${{ steps.deploy.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"
